# Continuous integration. The db suite is mandatory here: it runs against a
# throwaway Postgres, so the TEST_DATABASE_URL skip that local runs have does
# not apply.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests
      - name: Pure tests (no database)
        working-directory: backend
        run: uv run pytest tests/pure

  backend-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talkies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Database tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/talkies_test
        run: uv run pytest tests/db

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
