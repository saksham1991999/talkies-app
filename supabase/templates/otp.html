<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#e3e6d8;color:#2a1316;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
    <div style="max-width:420px;margin:0 auto;padding:28px 24px;background:#f2cbc1;border-radius:6px;">
      <p style="margin:0 0 8px;font-size:15px;font-weight:700;color:#b0342b;">Talkies</p>
      <h1 style="margin:0 0 16px;font-size:22px;line-height:1.25;">Your sign-in code</h1>
      <p style="margin:0 0 16px;font-size:16px;line-height:1.5;">Enter this code in the app to sign in.</p>
      <p style="margin:0 0 20px;font-size:36px;line-height:1.1;font-weight:700;letter-spacing:6px;font-family:ui-monospace,Menlo,Consolas,monospace;">{{ .Token }}</p>
      <p style="margin:0;font-size:14px;line-height:1.5;color:#6b5450;">The code works for 10 minutes. If you did not ask for it, ignore this email. Nobody can sign in without the code.</p>
    </div>
  </body>
</html>
