name: talkies
description: "Talkies: a movie ticket diary for India. Every film you watch becomes a ticket stub."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path_provider: ^2.1.6
  cached_network_image: ^4.0.3
  flutter_cache_manager: ^3.4.5
  http: ^1.6.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  intl: any
  url_launcher: ^6.3.2
  csv: ^8.0.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  app_links: ^7.2.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/catalog/
    - assets/paper/
    - assets/icons/
  fonts:
    - family: Tanker
      fonts:
        - asset: assets/fonts/Tanker-Regular.otf
    - family: Teko
      fonts:
        - asset: assets/fonts/Teko-SemiBold.ttf
